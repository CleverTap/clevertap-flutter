name: Flutter Unit Tests

on:
  pull_request:
    branches: [ develop, master ]
  push:
    branches: [ develop, master ]
  workflow_dispatch:

# Cancel the old run when a new commit is pushed to a PR.
# Runs on develop and master are never cancelled, so every merge keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  flutter-tests:
    name: Flutter unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the code from Repo
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Run unit tests
        run: flutter test
